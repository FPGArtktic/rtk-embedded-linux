# SPDX-License-Identifier: Apache-2.0
# Copyright 2026 FPGArtktic
#
# rtk filters for Yocto (BitBake) and Buildroot.  https://github.com/FPGArtktic/rtk-embedded-linux
#
# One file for every runtime. Each match_command is the prefix P followed by a tool-specific tail.
# P lets the tool appear at the start of a command segment, after a shell separator or opening
# quote, after `podman|apptainer|singularity run|exec ...`, or after any `*.sh` wrapper (which is
# the way around Docker, see README). Filters never depend on a wrapper name, path or runtime.
#
# Regex notes (Rust `regex`, no lookahead):
#   - (?x) verbose mode: whitespace and #-comments are ignored, so a literal space is written \s
#     and never placed inside a [...] class.
#   - rtk silently drops a filter whose match_command does not start with ^ ; hence ^.*? before P.
#   - rtk sorts filters by name, so definition order cannot resolve overlaps. Filters are mutually
#     exclusive by construction instead (scripts/check-routing.py proves it for every known form).
#   - The hook tests one command segment with quotes kept; execution tests basename(argv0) + argv
#     joined by spaces with quotes gone. Both forms must route to the same filter.
schema_version = 1


# ---------------------------------------------------------------------------------------------
# Yocto / BitBake
# ---------------------------------------------------------------------------------------------

[filters.bitbake-build]
description = "bitbake <target>: keeps ERROR/WARNING, failed-task logs (| lines) and both summaries; drops per-task NOTE progress, parse/cache chatter and the Build Configuration block (measured: -99.94% clean build, -99.97% sstate rebuild, -71% compile failure, -33% fetch failure)"
# Arguments may only be build flags, -c <task> and targets (recipes, virtual/x, mc:..., x:do_task);
# -e, -s, -g and -c listtasks are claimed by their own filters, --version and friends by none.
# The -c task word is any word except listtasks/do_listtasks, generated with:
#   scripts/complement-regex.py --class 'A-Za-z0-9_' listtasks do_listtasks
match_command = '''(?x)^.*?
  (?: ^ | [;&|'"]\s* | (?:podman|apptainer|singularity)\s+(?:run|exec)\b[^;&|]*[\s'"] | \S+\.sh\b[^;&|]*[\s'"] )
  bitbake
  (?: \s+ (?: -[kfnqvD]+ | --(?:continue|force|dry-run|quiet|verbose|setscene-only|skip-setscene|no-setscene)
            | (?: -c\s* | --(?:cmd|runall|runonly)(?:=|\s+) )
              (?:[A-Za-z0-9_--[dl]][A-Za-z0-9_]*|d(?:[A-Za-z0-9_--[o]][A-Za-z0-9_]*|o(?:[A-Za-z0-9_--[_]][A-Za-z0-9_]*|_(?:[A-Za-z0-9_--[l]][A-Za-z0-9_]*|l(?:[A-Za-z0-9_--[i]][A-Za-z0-9_]*|i(?:[A-Za-z0-9_--[s]][A-Za-z0-9_]*|s(?:[A-Za-z0-9_--[t]][A-Za-z0-9_]*|t(?:[A-Za-z0-9_--[t]][A-Za-z0-9_]*|t(?:[A-Za-z0-9_--[a]][A-Za-z0-9_]*|a(?:[A-Za-z0-9_--[s]][A-Za-z0-9_]*|s(?:[A-Za-z0-9_--[k]][A-Za-z0-9_]*|k(?:[A-Za-z0-9_--[s]][A-Za-z0-9_]*|s(?:[A-Za-z0-9_]+)|)|)|)|)|)|)|)|)|)|)|)|l(?:[A-Za-z0-9_--[i]][A-Za-z0-9_]*|i(?:[A-Za-z0-9_--[s]][A-Za-z0-9_]*|s(?:[A-Za-z0-9_--[t]][A-Za-z0-9_]*|t(?:[A-Za-z0-9_--[t]][A-Za-z0-9_]*|t(?:[A-Za-z0-9_--[a]][A-Za-z0-9_]*|a(?:[A-Za-z0-9_--[s]][A-Za-z0-9_]*|s(?:[A-Za-z0-9_--[k]][A-Za-z0-9_]*|k(?:[A-Za-z0-9_--[s]][A-Za-z0-9_]*|s(?:[A-Za-z0-9_]+)|)|)|)|)|)|)|)|))
            | [A-Za-z0-9][A-Za-z0-9_.+:/-]*
  ) )+
  \s* (?: [;&|'"] | $ )
'''
strip_ansi = true
# Non-interactive knotty writes progress and summaries to stdout, and only the first line of each
# WARNING/ERROR to stderr ("Log data follows:" and the "| " task-log lines go to stdout). stderr is
# therefore left unfiltered: it carries nothing but WARNING/ERROR, and it reaches the agent first,
# so each ERROR still comes before its log. With filter_stderr = true rtk would append it last.
filter_stderr = false
# Known noise only: any line not listed here, including every NOTE not listed, survives.
strip_lines_matching = [
  '^NOTE: Running (?:setscene |noexec )?task \d+ of \d+ \(',
  '^NOTE: recipe \S+: task \S+: (?:Started|Succeeded)$',
  '^NOTE: (?:Executing (?:SetScene )?Tasks|Resolving any missing task queue dependencies|Setscene tasks completed)$',
  '^NOTE: Fetching uninative binary shim ',
  '^(?:Loading cache\.\.\.|Loaded \d+ entries from dependency cache\.|Parsing recipes\.\.\.|Parsing of \d+ \.bb files complete|Initialising tasks\.\.\.|Checking sstate mirror object availability\.\.\.|Sstate summary: )',
  '^done\.$',
  # the Build Configuration block: header, VAR = "value" lines, layer lines
  '^Build Configuration:$',
  '^[A-Z][A-Z0-9_]*\s+= ".*"$',
  '^(?:meta[\w-]*|workspace)\s*(?:= "[^"]*")?$',
  '^\s*$',
]
on_empty = "bitbake: nothing to report"

[filters.bitbake-e]
description = "bitbake -e: drops variable history comments and blank lines, shows the first 100 lines; rtk saves the rest (comment-free) and prints `tail -n +101 <file>` to read it (measured: -99.77%)"
match_command = '''(?x)^.*?
  (?: ^ | [;&|'"]\s* | (?:podman|apptainer|singularity)\s+(?:run|exec)\b[^;&|]*[\s'"] | \S+\.sh\b[^;&|]*[\s'"] )
  bitbake (?: \s+ (?:[^\s;&|'"]|'[^']*'|"[^"]*")+ )*? \s+ (?: -e | --environment ) (?: [\s;&|'"] | $ )
'''
strip_ansi = true
# 53% of the output is history comments ("# $VAR [N operations]" ...). What remains is ~1 MB of
# VAR="value" lines and function bodies, still far too much to read, so only the first lines are
# shown. max_lines (not truncate_lines_at) keeps rtk's tee file the filtered text rather than the
# raw 2 MB, so the whole comment-free environment fits rtk's default 1 MiB tee cap and can be
# grepped there. `bitbake -e X | grep ...` is a pipeline and is never rewritten by rtk.
strip_lines_matching = [
  '^#',
  '^(?:Loading cache\.\.\.|Loaded \d+ entries from dependency cache\.|Parsing recipes\.\.\.|Parsing of \d+ \.bb files complete)',
  '^NOTE: (?:Starting bitbake server\.\.\.|Resolving any missing task queue dependencies)$',
  '^\s*$',
]
max_lines = 100

[filters.bitbake-s]
description = "bitbake -s: drops cache chatter, trims trailing padding and the gap after the recipe name; later columns keep their alignment (measured: -75.7%)"
match_command = '''(?x)^.*?
  (?: ^ | [;&|'"]\s* | (?:podman|apptainer|singularity)\s+(?:run|exec)\b[^;&|]*[\s'"] | \S+\.sh\b[^;&|]*[\s'"] )
  bitbake (?: \s+ (?:[^\s;&|'"]|'[^']*'|"[^"]*")+ )*? \s+ (?: -s | --show-versions ) (?: [\s;&|'"] | $ )
'''
strip_ansi = true
strip_lines_matching = [
  '^(?:Loading cache\.\.\.|Loaded \d+ entries from dependency cache\.|Parsing recipes\.\.\.|Parsing of \d+ \.bb files complete)',
  '^NOTE: (?:Starting bitbake server\.\.\.|Resolving any missing task queue dependencies)$',
  '^\s*$',
]
# Rows are padded to fixed-width columns. The first two (recipe, latest version) are always set, so
# their gap can shrink; Preferred/Required may be empty, so their alignment is left alone.
replace = [
  { pattern = '\s+$', replacement = '' },
  { pattern = '^(\S+)\s{2,}(\S)', replacement = '${1} ${2}' },
]

[filters.bitbake-listtasks]
description = "bitbake -c listtasks: keeps the do_* task table and summaries; drops the build chatter around it (measured: -19.3%)"
match_command = '''(?x)^.*?
  (?: ^ | [;&|'"]\s* | (?:podman|apptainer|singularity)\s+(?:run|exec)\b[^;&|]*[\s'"] | \S+\.sh\b[^;&|]*[\s'"] )
  bitbake (?: \s+ (?:[^\s;&|'"]|'[^']*'|"[^"]*")+ )*? \s+ (?: -c\s* | --cmd(?:=|\s+) ) (?:do_)?listtasks (?: [\s;&|'"] | $ )
'''
strip_ansi = true
strip_lines_matching = [
  '^NOTE: Running (?:setscene |noexec )?task \d+ of \d+ \(',
  '^NOTE: recipe \S+: task \S+: (?:Started|Succeeded)$',
  '^NOTE: (?:Executing (?:SetScene )?Tasks|No setscene tasks|Setscene tasks completed)$',
  '^(?:Loading cache\.\.\.|Loaded \d+ entries from dependency cache\.|Parsing recipes\.\.\.|Parsing of \d+ \.bb files complete)',
  '^NOTE: (?:Starting bitbake server\.\.\.|Resolving any missing task queue dependencies)$',
  '^(?:Initialising tasks\.\.\.|Checking sstate mirror object availability\.\.\.|Sstate summary: )',
  '^done\.$',
  '^Build Configuration:$',
  '^[A-Z][A-Z0-9_]*\s+= ".*"$',
  '^(?:meta[\w-]*|workspace)\s*(?:= "[^"]*")?$',
  '^\s*$',
]

[filters.bitbake-g]
description = "bitbake -g: keeps the lines naming the written .dot/buildlist files; drops cache chatter (measured: -54.9%)"
match_command = '''(?x)^.*?
  (?: ^ | [;&|'"]\s* | (?:podman|apptainer|singularity)\s+(?:run|exec)\b[^;&|]*[\s'"] | \S+\.sh\b[^;&|]*[\s'"] )
  bitbake (?: \s+ (?:[^\s;&|'"]|'[^']*'|"[^"]*")+ )*? \s+ (?: -g | --graphviz ) (?: [\s;&|'"] | $ )
'''
strip_ansi = true
strip_lines_matching = [
  '^(?:Loading cache\.\.\.|Loaded \d+ entries from dependency cache\.|Parsing recipes\.\.\.|Parsing of \d+ \.bb files complete)',
  '^NOTE: (?:Starting bitbake server\.\.\.|Resolving any missing task queue dependencies)$',
  '^\s*$',
]

[filters.bitbake-layers]
description = "bitbake-layers show-layers|show-recipes|show-appends: drops server/cache chatter and collapses column padding (measured: -55% show-layers, -32% show-recipes, -2% show-appends)"
match_command = '''(?x)^.*?
  (?: ^ | [;&|'"]\s* | (?:podman|apptainer|singularity)\s+(?:run|exec)\b[^;&|]*[\s'"] | \S+\.sh\b[^;&|]*[\s'"] )
  bitbake-layers (?: \s+ (?:[^\s;&|'"]|'[^']*'|"[^"]*")+ )*? \s+ show-(?:layers|recipes|appends|overlayed|cross-depends) (?: [\s;&|'"] | $ )
'''
strip_ansi = true
strip_lines_matching = [
  '^(?:Loading cache\.\.\.|Loaded \d+ entries from dependency cache\.|Parsing recipes\.\.\.|Parsing of \d+ \.bb files complete)',
  '^NOTE: (?:Starting bitbake server\.\.\.|Resolving any missing task queue dependencies)$',
  '^\s*$',
]
# Every column of these tables is always filled, so a run of spaces between two fields carries no
# information. Indentation (which marks the per-layer lines of show-recipes) is kept.
replace = [
  { pattern = '(\S) {2,}', replacement = '${1} ' },
  { pattern = '\s+$', replacement = '' },
]

[filters.bitbake-getvar]
description = "bitbake-getvar: keeps the value and every operation (file:line + its value); drops the [doc] text, varflag operations and the unexpanded duplicate of the value (measured: -36.3%)"
match_command = '''(?x)^.*?
  (?: ^ | [;&|'"]\s* | (?:podman|apptainer|singularity)\s+(?:run|exec)\b[^;&|]*[\s'"] | \S+\.sh\b[^;&|]*[\s'"] )
  bitbake-getvar (?: [\s;&|'"] | $ )
'''
strip_ansi = true
strip_lines_matching = [
  '^#$',
  '^#     \[[A-Za-z0-9_.-]+\] ',
  '^# pre-expansion value:$',
  '^#   "',
  '^(?:Loading cache\.\.\.|Loaded \d+ entries from dependency cache\.|Parsing recipes\.\.\.|Parsing of \d+ \.bb files complete)',
  '^NOTE: (?:Starting bitbake server\.\.\.|Resolving any missing task queue dependencies)$',
]


# ---------------------------------------------------------------------------------------------
# Buildroot
# ---------------------------------------------------------------------------------------------
# Every `make` this project runs must land in one of the buildroot-* filters: a make command no
# project filter claims falls through to rtk's built-in `make` filter, which drops `make[N]: ***`
# error lines and keeps only the first 50 lines.

[filters.buildroot-make]
description = "Buildroot make / make <defconfig> / make <pkg>[-rebuild]: a clean build becomes one line; a failure keeps errors, *** lines and >>> steps (last 200 lines) (measured: -99.99% full build, -99.5% rebuild, -93.6% defconfig, -99.8% long failure, -32% short failure)"
# Arguments are options, VAR=value assignments, or targets. A target is hyphen-separated segments,
# none of which is show, graph, legal, list, printvars, help or deps: those belong to the other
# buildroot-* filters. The segment regex is generated with:
#   scripts/complement-regex.py show graph legal list printvars help deps
match_command = '''(?x)^.*?
  (?: ^ | [;&|'"]\s* | (?:podman|apptainer|singularity)\s+(?:run|exec)\b[^;&|]*[\s'"] | \S+\.sh\b[^;&|]*[\s'"] )
  make
  (?: \s+ (?: -[CfIoW]\s*[^\s;&|'"]+
            | -[^\s;&|'"]*
            | [A-Za-z_][A-Za-z0-9_]*\+?=(?:[^\s;&|'"]|'[^']*'|"[^"]*")*
            | (?:[A-Za-z0-9_.+--[dghlps]][A-Za-z0-9_.+]*|d(?:[A-Za-z0-9_.+--[e]][A-Za-z0-9_.+]*|e(?:[A-Za-z0-9_.+--[p]][A-Za-z0-9_.+]*|p(?:[A-Za-z0-9_.+--[s]][A-Za-z0-9_.+]*|s(?:[A-Za-z0-9_.+]+)|)|)|)|g(?:[A-Za-z0-9_.+--[r]][A-Za-z0-9_.+]*|r(?:[A-Za-z0-9_.+--[a]][A-Za-z0-9_.+]*|a(?:[A-Za-z0-9_.+--[p]][A-Za-z0-9_.+]*|p(?:[A-Za-z0-9_.+--[h]][A-Za-z0-9_.+]*|h(?:[A-Za-z0-9_.+]+)|)|)|)|)|h(?:[A-Za-z0-9_.+--[e]][A-Za-z0-9_.+]*|e(?:[A-Za-z0-9_.+--[l]][A-Za-z0-9_.+]*|l(?:[A-Za-z0-9_.+--[p]][A-Za-z0-9_.+]*|p(?:[A-Za-z0-9_.+]+)|)|)|)|l(?:[A-Za-z0-9_.+--[ei]][A-Za-z0-9_.+]*|e(?:[A-Za-z0-9_.+--[g]][A-Za-z0-9_.+]*|g(?:[A-Za-z0-9_.+--[a]][A-Za-z0-9_.+]*|a(?:[A-Za-z0-9_.+--[l]][A-Za-z0-9_.+]*|l(?:[A-Za-z0-9_.+]+)|)|)|)|i(?:[A-Za-z0-9_.+--[s]][A-Za-z0-9_.+]*|s(?:[A-Za-z0-9_.+--[t]][A-Za-z0-9_.+]*|t(?:[A-Za-z0-9_.+]+)|)|)|)|p(?:[A-Za-z0-9_.+--[r]][A-Za-z0-9_.+]*|r(?:[A-Za-z0-9_.+--[i]][A-Za-z0-9_.+]*|i(?:[A-Za-z0-9_.+--[n]][A-Za-z0-9_.+]*|n(?:[A-Za-z0-9_.+--[t]][A-Za-z0-9_.+]*|t(?:[A-Za-z0-9_.+--[v]][A-Za-z0-9_.+]*|v(?:[A-Za-z0-9_.+--[a]][A-Za-z0-9_.+]*|a(?:[A-Za-z0-9_.+--[r]][A-Za-z0-9_.+]*|r(?:[A-Za-z0-9_.+--[s]][A-Za-z0-9_.+]*|s(?:[A-Za-z0-9_.+]+)|)|)|)|)|)|)|)|)|s(?:[A-Za-z0-9_.+--[h]][A-Za-z0-9_.+]*|h(?:[A-Za-z0-9_.+--[o]][A-Za-z0-9_.+]*|o(?:[A-Za-z0-9_.+--[w]][A-Za-z0-9_.+]*|w(?:[A-Za-z0-9_.+]+)|)|)|))
              (?: - (?:[A-Za-z0-9_.+--[dghlps]][A-Za-z0-9_.+]*|d(?:[A-Za-z0-9_.+--[e]][A-Za-z0-9_.+]*|e(?:[A-Za-z0-9_.+--[p]][A-Za-z0-9_.+]*|p(?:[A-Za-z0-9_.+--[s]][A-Za-z0-9_.+]*|s(?:[A-Za-z0-9_.+]+)|)|)|)|g(?:[A-Za-z0-9_.+--[r]][A-Za-z0-9_.+]*|r(?:[A-Za-z0-9_.+--[a]][A-Za-z0-9_.+]*|a(?:[A-Za-z0-9_.+--[p]][A-Za-z0-9_.+]*|p(?:[A-Za-z0-9_.+--[h]][A-Za-z0-9_.+]*|h(?:[A-Za-z0-9_.+]+)|)|)|)|)|h(?:[A-Za-z0-9_.+--[e]][A-Za-z0-9_.+]*|e(?:[A-Za-z0-9_.+--[l]][A-Za-z0-9_.+]*|l(?:[A-Za-z0-9_.+--[p]][A-Za-z0-9_.+]*|p(?:[A-Za-z0-9_.+]+)|)|)|)|l(?:[A-Za-z0-9_.+--[ei]][A-Za-z0-9_.+]*|e(?:[A-Za-z0-9_.+--[g]][A-Za-z0-9_.+]*|g(?:[A-Za-z0-9_.+--[a]][A-Za-z0-9_.+]*|a(?:[A-Za-z0-9_.+--[l]][A-Za-z0-9_.+]*|l(?:[A-Za-z0-9_.+]+)|)|)|)|i(?:[A-Za-z0-9_.+--[s]][A-Za-z0-9_.+]*|s(?:[A-Za-z0-9_.+--[t]][A-Za-z0-9_.+]*|t(?:[A-Za-z0-9_.+]+)|)|)|)|p(?:[A-Za-z0-9_.+--[r]][A-Za-z0-9_.+]*|r(?:[A-Za-z0-9_.+--[i]][A-Za-z0-9_.+]*|i(?:[A-Za-z0-9_.+--[n]][A-Za-z0-9_.+]*|n(?:[A-Za-z0-9_.+--[t]][A-Za-z0-9_.+]*|t(?:[A-Za-z0-9_.+--[v]][A-Za-z0-9_.+]*|v(?:[A-Za-z0-9_.+--[a]][A-Za-z0-9_.+]*|a(?:[A-Za-z0-9_.+--[r]][A-Za-z0-9_.+]*|r(?:[A-Za-z0-9_.+--[s]][A-Za-z0-9_.+]*|s(?:[A-Za-z0-9_.+]+)|)|)|)|)|)|)|)|)|s(?:[A-Za-z0-9_.+--[h]][A-Za-z0-9_.+]*|h(?:[A-Za-z0-9_.+--[o]][A-Za-z0-9_.+]*|o(?:[A-Za-z0-9_.+--[w]][A-Za-z0-9_.+]*|w(?:[A-Za-z0-9_.+]+)|)|)|)) )*
  ) )*
  \s* (?: [;&|'"] | $ )
'''
strip_ansi = true
# make writes compiler errors and `make: ***` to stderr, and so do wget's progress and most
# warnings: without this they would bypass the filter. rtk appends stderr after stdout.
filter_stderr = true
# Everything below runs only when the short-circuit did not fire: a failure, a Buildroot WARNING,
# or output that is not a build (make --version, ...). Unknown lines always survive.
strip_lines_matching = [
  '^\s*$',
  # downloads: wget progress and chatter
  '^\s*\d+K[ .]+',
  '^--\d{4}-\d\d-\d\d \d\d:\d\d:\d\d--  ',
  '^(?:Resolving |Connecting to |HTTP request sent|Length: |Saving to: |Location: |Reusing existing connection)',
  '^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d \(.*\) - .* saved',
  # autotools / libtool
  '^checking ',
  '^config\.status: ',
  '^configure: (?:creating|loading|updating|executing|WARNING: unrecognized options:)',
  '^libtoolize: ',
  '^libtool: (?:compile|link|install|finish|warning: remember to run)',
  '^(?:Making|making) \w+ in ',
  # make chatter
  '^make(?:\[\d+\])?: (?:Entering|Leaving) directory',
  '^make(?:\[\d+\])?: Nothing to be done',
  '^make(?:\[\d+\])?: .* is up to date\.$',
  # silent-rule progress, one word + one path: "  CC      x.o", "  CC [M]  x.o", "  XZ  x.ko.xz"
  '^\s+[A-Z][A-Z0-9_-]{1,15}(?:\s+\[[A-Z]\])?\s+\S+\s*$',
  # echoed recipe commands: compiler/linker with options, shell builtins and file tools
  '^\s*(?:\S*/)?(?:[\w.+-]+-)?(?:gcc|g\+\+|cc|c\+\+|clang|ld|ar|ranlib|strip|objcopy|nm|as|cpp)\s+-',
  '^\s*(?:\S*/)?(?:bash|sh) \S*libtool ',
  '^\s*(?:\S*/)?(?:install|mkdir|rm|cp|ln|chmod|mv|rsync|sed|tar|touch|cd|test|echo|printf|true|find|xargs|perl|python3?|cat)\s',
  '^\s*(?:\S*/)?make\s+-',
  '^\s*(?:for|if|then|else|elif|fi|done|while|do|case|esac)\b',
  '^\(cd ',
  '^(?:GIT_DIR|PATH|PKG_CONFIG_PATH|PKG_CONFIG|CC|CXX|CFLAGS|LDFLAGS|PERL)=',
  # patches
  '^Applying \S+ using patch:',
  '^(?:patching|checking) file ',
  '^Hunk #\d+ succeeded at ',
  # kconfig prompts and banners (busybox/linux oldconfig)
  '\([A-Z0-9_]+\) \[[A-Za-z0-9/?]+\]',
  '^\*$',
  '^\* ',
  '^#$',
  # comments echoed from make recipes ("# Install modules and remove symbolic links ...")
  '^# ',
  # libtool "Libraries have been installed" banner
  '^-{20,}$',
  '^Libraries have been installed in:$',
  '^\s+/\S+$',
  '^If you ever happen to want to link against installed libraries',
  '^in a given directory, LIBDIR, you must either use libtool',
  '^specify the full pathname of the library, or use the',
  '^flag during linking and do at least one of the following:',
  '^\s+- (?:add LIBDIR to the|use the .-Wl,|have your system administrator)',
  '^See any operating system documentation about shared libraries for',
  '^more information, such as the ld\(1\) and ld\.so\(8\) manual pages\.',
  # image generation and configure chatter
  '^INFO: ',
  '^DEBUG: ',
]
# A failing make stops at the error, so errors and `make: ***` are at the end. rtk tees the raw
# output and prints the path when lines are cut.
tail_lines = 200
on_empty = "buildroot: OK"

# A build (">>>" steps or a written .config) with no failure marker is reported as one line.
# `make[N]: [...] Error 1 (ignored)` has no `***` and does not count as a failure.
[[filters.buildroot-make.match_output]]
pattern = '(?m)^>>> |^# configuration written to '
unless = '(?m)^make(?:\[\d+\])?: \*\*\*|^WARNING:|^ERROR:|: (?:fatal )?error: |undefined reference to |No rule to make target'
message = "buildroot: OK"

[filters.buildroot-printvars]
description = "make printvars / show-vars / [<pkg>-]show-info|show-version: passthrough (values must stay verbatim); exists so rtk's built-in make filter cannot cut them (measured: 0%, by design)"
match_command = '''(?x)^.*?
  (?: ^ | [;&|'"]\s* | (?:podman|apptainer|singularity)\s+(?:run|exec)\b[^;&|]*[\s'"] | \S+\.sh\b[^;&|]*[\s'"] )
  make (?: \s+ (?:[^\s;&|'"]|'[^']*'|"[^"]*")+ )*? \s+ (?: printvars | show-vars | (?:[^\s;&|'"]+-)?show-(?:info|version) ) (?: [\s;&|'"] | $ )
'''

[filters.buildroot-show-targets]
description = "make show-targets / list-defconfigs / help / external-deps: listings, kept whole; drops only the redundant '- Build for <name>' of each defconfig (measured: -56.7% list-defconfigs, 0% show-targets)"
match_command = '''(?x)^.*?
  (?: ^ | [;&|'"]\s* | (?:podman|apptainer|singularity)\s+(?:run|exec)\b[^;&|]*[\s'"] | \S+\.sh\b[^;&|]*[\s'"] )
  make (?: \s+ (?:[^\s;&|'"]|'[^']*'|"[^"]*")+ )*? \s+ (?: show-targets | list-defconfigs | help | external-deps ) (?: [\s;&|'"] | $ )
'''
# Every built-in defconfig is described as "Build for <its own name>", which adds nothing.
replace = [
  { pattern = '^(\s*)(\S+)_defconfig\s+- Build for (\S+)\s*$', replacement = '${1}${2}_defconfig' },
]

[filters.buildroot-depends]
description = "make <pkg>-show-[recursive-]depends / graph-depends: passthrough (small lists); exists so rtk's built-in make filter cannot cut them (measured: 0%, by design)"
match_command = '''(?x)^.*?
  (?: ^ | [;&|'"]\s* | (?:podman|apptainer|singularity)\s+(?:run|exec)\b[^;&|]*[\s'"] | \S+\.sh\b[^;&|]*[\s'"] )
  make (?: \s+ (?:[^\s;&|'"]|'[^']*'|"[^"]*")+ )*? \s+
  (?: (?:[^\s;&|'"]+-)? (?: show-(?:recursive-)?r?depends | graph-r?depends ) | graph-build | graph-size )
  (?: [\s;&|'"] | $ )
'''

[filters.buildroot-legal-info]
description = "make legal-info: keeps WARNING/ERROR lines, the >>> step they belong to and the summary; drops per-file 'OK (sha256: ...)' checks (measured: -70.6%)"
match_command = '''(?x)^.*?
  (?: ^ | [;&|'"]\s* | (?:podman|apptainer|singularity)\s+(?:run|exec)\b[^;&|]*[\s'"] | \S+\.sh\b[^;&|]*[\s'"] )
  make (?: \s+ (?:[^\s;&|'"]|'[^']*'|"[^"]*")+ )*? \s+ (?:[^\s;&|'"]+-)? legal-info (?: [\s;&|'"] | $ )
'''
strip_ansi = true
filter_stderr = true
strip_lines_matching = [
  '^\S+: OK \(sha256: [0-9a-f]{64}\)$',
  '^\s*$',
]


